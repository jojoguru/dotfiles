"$schema" = 'https://starship.rs/config-schema.json'

# Powerline layout after "Gort!" by richbl (https://stellar.a3chron.dev/richbl/gort),
# colors from Omarchy Gruvbox (themes/gruvbox/colors.toml).
# Separators are Nerd Font glyphs:  = powerline arrow,  = branch,  = lock.

add_newline = true
command_timeout = 200
palette = "omarchy_gruvbox"

### default format for reference ###
#format = """\
#[](bg:bar fg:ok)\
#$hostname\
#$username\
#$git_branch\
#$git_commit\
#$git_status\
#$git_state\
#$directory\
#$jobs\
#$battery\
#$cmd_duration\
#$character"""


format = """\
[](bg:bar fg:ok)\
$username\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
$kubernetes\
$jobs\
$battery\
$cmd_duration\
$character"""

[palettes.omarchy_gruvbox]
bar   = "#3c3836" # lighter_background
text  = "#282828" # background
fg    = "#d4be98" # foreground
host  = "#d3869b" # magenta
user  = "#7daea3" # blue
git   = "#a9b665" # green
dir   = "#d8a657" # yellow
kube  = "#89b482" # cyan
ok    = "#a9b665" # green
warning = "#e1875c" # orange
alert = "#ea6962" # red

[hostname]
ssh_only = false
trim_at = "."
style = "bg:host fg:text"
format = "[[](bg:host fg:bar) $hostname [](bg:bar fg:host)]($style)"

[username]
show_always = true
style_user = "bg:user fg:text"
style_root = "bg:alert fg:text"
format = "[[](bg:user fg:bar) $user [](bg:bar fg:user)]($style)"

[git_branch]
symbol = " "
style = "bg:git fg:text"
format = "[[](bg:git fg:bar) $symbol$branch [](bg:bar fg:git)]($style)"

[git_commit]
commit_hash_length = 7
style = "bg:git fg:text"
format = "[[](bg:git fg:bar) #$hash [](bg:bar fg:git)]($style)"

# modified and conflicted get their own pill (warning / alert) next to the green one.
[git_status]
style = "bg:git fg:text"
stashed = "${count}S "
staged = "${count}+ "
modified = "[[](bg:warning fg:bar) ${count}* [](bg:bar fg:warning)](bg:warning fg:text)"
renamed = "${count}» "
untracked = "${count}? "
deleted = "${count}- "
conflicted = "[[](bg:alert fg:bar) ${count}! [](bg:bar fg:alert)](bg:alert fg:text)"
ahead = "${count}⇡ "
behind = "${count}⇣ "
diverged = "${ahead_count}⇡${behind_count}⇣ "
format = "([[](bg:git fg:bar) $stashed$staged$renamed$untracked$deleted$ahead_behind[](bg:bar fg:git)]($style))$modified$conflicted"

[git_state]
style = "bg:git fg:text"
rebase = "rebasing"
merge = "merging"
revert = "reverting"
cherry_pick = "cherry picking"
bisect = "bisecting"
am = "am'ing"
am_or_rebase = "am/rebase"
format = "[[](bg:git fg:bar) $state( $progress_current/$progress_total) [](bg:bar fg:git)]($style)"

[directory]
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
style = "bg:dir fg:text"
read_only = ""
read_only_style = "bg:alert fg:text"
format = "([[](bg:alert fg:bar) $read_only [](bg:bar fg:alert)]($read_only_style))[[](bg:dir fg:bar) $path [](bg:bar fg:dir)]($style)"

# Längere Kontextnamen werden auf die ersten 4 und letzten 7 Zeichen gekürzt
# (whe-iris-aks-staging → whe-…staging), damit die Umgebung am Ende lesbar
# bleibt. Namen bis 14 Zeichen passen nicht aufs Muster und bleiben vollständig.
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bg:kube fg:text"
format = "[[](bg:kube fg:bar) $symbol$context [](bg:bar fg:kube)]($style)"

[[kubernetes.contexts]]
context_pattern = "(.{4}).{4,}(.{7})"
context_alias = "${1}…${2}"

[jobs]
symbol = "jobs:"
number_threshold = 1
style = "bg:alert fg:text"
format = "[[](bg:alert fg:bar) $symbol$number [](bg:bar fg:alert)]($style)"

[battery]
format = "[[](bg:alert fg:bar) $percentage [](bg:bar fg:alert)]($style)"

[[battery.display]]
threshold = 25
style = "bg:alert fg:text"

[cmd_duration]
min_time = 2_000
show_milliseconds = false
style = "bg:bar fg:fg"
format = "[ $duration ]($style)"

[character]
success_symbol = "[[](bg:ok fg:bar)](fg:ok)"
error_symbol = "[[](bg:alert fg:bar)](fg:alert)"
format = "$symbol "
